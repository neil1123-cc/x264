    - name: MP4 smoke (8bit CLI AUD request stays valid)
      if: matrix.target_cpu == 'x86-64'
      run: |
        ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=128x72:rate=24 -frames:v 16 -pix_fmt yuv420p smoke_aud.y4m
        build/8b/x264.exe --fps 24/1 --frames 16 --bframes 4 --keyint 8 --min-keyint 8 --aud -o smoke_aud.mp4 smoke_aud.y4m
        ffprobe -v error -show_entries format=format_name -of default=noprint_wrappers=1 smoke_aud.mp4 > smoke_aud_format.txt
        ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=noprint_wrappers=1 smoke_aud.mp4 > smoke_aud_count.txt
        ffprobe -v error -show_packets -select_streams v:0 -show_entries packet=pts_time,dts_time,flags -of csv=p=0 smoke_aud.mp4 > smoke_aud_packets.csv
        grep -q "format_name=mov,mp4,m4a,3gp,3g2,mj2" smoke_aud_format.txt
        grep -q "nb_read_frames=16" smoke_aud_count.txt
        test -s smoke_aud_packets.csv

    - name: MP4 smoke (8bit CLI warns and downgrades cbr nal-hrd)
      if: matrix.target_cpu == 'x86-64'
      run: |
        ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=128x72:rate=24 -frames:v 16 -pix_fmt yuv420p smoke_hrd.y4m
        build/8b/x264.exe --fps 24/1 --frames 16 --bframes 4 --keyint 8 --min-keyint 8 --vbv-bufsize 1000 --vbv-maxrate 1000 --nal-hrd cbr -o smoke_hrd.mp4 smoke_hrd.y4m > smoke_hrd.log 2>&1
        grep -q "cbr nal-hrd is not compatible with mp4" smoke_hrd.log
        grep -q "nal_hrd=vbr" smoke_hrd.log
        test -s smoke_hrd.mp4

    - name: MP4 smoke (8bit CLI warns and normalizes intra-refresh open-gop)
      if: matrix.target_cpu == 'x86-64'
      run: |
        trap 'status=$?; if [ $status -ne 0 ]; then echo "=== x264 mp4 intra-refresh diagnostics ==="; for f in smoke_ir_format.txt smoke_ir_stream.txt smoke_ir_count.txt smoke_ir_packets.csv smoke_ir_frames.csv smoke_ir.log; do if [ -f "$f" ]; then echo "--- $f ---"; cat "$f"; fi; done; fi; exit $status' EXIT
        ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=128x72:rate=24 -frames:v 16 -pix_fmt yuv420p smoke_ir.y4m
        build/8b/x264.exe --fps 24/1 --frames 16 --bframes 1 --b-pyramid none --ref 1 --keyint 8 --min-keyint 8 --intra-refresh --open-gop -o smoke_ir.mp4 smoke_ir.y4m > smoke_ir.log 2>&1
        grep -q "intra-refresh is not compatible with open-gop" smoke_ir.log
        ffprobe -v error -show_streams -select_streams v:0 smoke_ir.mp4 > smoke_ir_stream.txt
        ffprobe -v error -show_entries format=format_name -of default=noprint_wrappers=1 smoke_ir.mp4 > smoke_ir_format.txt
        ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=noprint_wrappers=1 smoke_ir.mp4 > smoke_ir_count.txt
        ffprobe -v error -show_packets -select_streams v:0 -show_entries packet=pts_time,dts_time,flags -of csv=p=0 smoke_ir.mp4 > smoke_ir_packets.csv
        ffprobe -v error -select_streams v:0 -show_entries frame=pts_time,pkt_dts_time,pkt_duration_time,key_frame -of csv=p=0 smoke_ir.mp4 > smoke_ir_frames.csv
        grep -q "format_name=mov,mp4,m4a,3gp,3g2,mj2" smoke_ir_format.txt
        grep -q "codec_name=h264" smoke_ir_stream.txt
        grep -q "codec_tag_string=avc1" smoke_ir_stream.txt
        grep -q "nb_read_frames=16" smoke_ir_count.txt
        test -s smoke_ir.mp4
        test -s smoke_ir_packets.csv
        test -s smoke_ir_frames.csv

    - name: Package
      run: |
        mkdir dist
        cp build/8b/x264.exe dist/x264-win64-${{ matrix.target_cpu }}-8bit.exe
        cp build/10b/x264.exe dist/x264-win64-${{ matrix.target_cpu }}-10bit.exe
        cp build/all/x264.exe dist/x264-win64-${{ matrix.target_cpu }}-all.exe

    - name: Get Package Version
      id: package_version
      shell: bash
      run: |
        version_line=$(./build/all/x264.exe --version | head -n 1)
        version=$(printf '%s\n' "$version_line" | awk '{print $2 "-" $3}')
        release_version=$(printf '%s\n' "$version_line" | awk '{print $2}')
        test -n "$version"
        test -n "$release_version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

    - name: Compress Package
      run: |
        cd dist
        archive="x264-win64-${{ matrix.target_cpu }}-clang.${{ steps.package_version.outputs.version }}.7z"
        release_archive="x264-win64-${{ matrix.target_cpu }}-clang.${{ steps.package_version.outputs.release_version }}.7z"
        7za a -t7z -mx=9 "../$archive" ./*.exe
        cp "../$archive" "../$release_archive"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: x264-win64-${{ matrix.target_cpu }}-clang.${{ steps.package_version.outputs.version }}
        path: x264-win64-${{ matrix.target_cpu }}-clang.${{ steps.package_version.outputs.version }}.7z
        compression-level: 0

    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ github.ref_name }}
        files: x264-win64-${{ matrix.target_cpu }}-clang.${{ steps.package_version.outputs.release_version }}.7z
        fail_on_unmatched_files: true
        overwrite_files: true
        generate_release_notes: false
        prerelease: true
